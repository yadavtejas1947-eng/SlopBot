<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — SlopBot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            S
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="auth-subtitle">
            Login to continue using SlopBot.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter your username"
                maxlength="30"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Create one
            </a>

        </p>

    </div>

</body>

</html>
