<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<h1>Login</h1>

<form method="POST">

    <input
        name="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        name="password"
        type="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="/signup">Create one</a>
</p>

</body>
</html>
