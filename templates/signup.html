<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
</head>

<body>

<h1>Create Account</h1>

<form method="POST">

    <input
        name="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        name="password"
        type="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Create Account
    </button>

</form>

<p>
    Already have an account?
    <a href="/login">Login</a>
</p>

</body>
</html>
