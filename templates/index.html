<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="csrf-token"
        content="{{ csrf_token }}"
    >

    <title>SlopBot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="app">

        <header class="header">

            <div class="brand">

                <div class="logo">
                    S
                </div>

                <div>

                    <div class="brand-name">
                        SlopBot
                    </div>

                    <div class="status">
                        AI Assistant
                    </div>

                </div>

            </div>

            <div class="account">

                <span class="username">
                    {{ username }}
                </span>

                <a
                    class="logout"
                    href="{{ url_for('logout') }}"
                >
                    Logout
                </a>

            </div>

        </header>


        <main
            id="chat"
            class="chat"
        >

            <div class="welcome">

                <div class="welcome-icon">
                    S
                </div>

                <h1>
                    Hey, {{ username }}.
                </h1>

                <p>
                    What can I help you with?
                </p>

            </div>

        </main>


        <div class="input-wrapper">

            <div class="input-area">

                <textarea
                    id="message"
                    rows="1"
                    maxlength="10000"
                    placeholder="Message SlopBot..."
                    autocomplete="off"
                ></textarea>

                <button
                    id="send"
                    type="button"
                    aria-label="Send message"
                >
                    ↑
                </button>

            </div>

            <div class="input-note">
                SlopBot can make mistakes. Check important information.
                <br>
                <strong>Privacy:</strong> Messages and AI responses may be stored
                and accessible to the service operator. Please don't share sensitive
                personal information.
</div>

        </div>

    </div>


    <script>
        window.CSRF_TOKEN = "{{ csrf_token }}";
    </script>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
